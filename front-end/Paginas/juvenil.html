<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <div class="container my-5">
        <div class="row g-4">

            <!-- Jugadores -->
            <div class="col-12 col-md-4">
                <div class="card stat-card text-white border-0 rounded-4 p-4 h-100 bg-blue">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <i class="bi bi-people fs-2"></i>
                        <span class="fs-2 fw-bold">23</span>
                    </div>
                    <h5 class="fw-semibold">Jugadores</h5>
                    <p class="small mb-0 opacity-75">En la plantilla actual</p>
                </div>
            </div>

            <!-- Goles Totales -->
            <div class="col-12 col-md-4">
                <div class="card stat-card text-white border-0 rounded-4 p-4 h-100 bg-green">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <i class="bi bi-bullseye fs-2"></i>
                        <span class="fs-2 fw-bold">48</span>
                    </div>
                    <h5 class="fw-semibold">Goles Totales</h5>
                    <p class="small mb-0 opacity-75">En la temporada</p>
                </div>
            </div>

            <!-- Asistencias -->
            <div class="col-12 col-md-4">
                <div class="card stat-card text-white border-0 rounded-4 p-4 h-100 bg-purple">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <i class="bi bi-graph-up fs-2"></i>
                        <span class="fs-2 fw-bold">31</span>
                    </div>
                    <h5 class="fw-semibold">Asistencias</h5>
                    <p class="small mb-0 opacity-75">En la temporada</p>
                </div>
            </div>

        </div>
    </div>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>

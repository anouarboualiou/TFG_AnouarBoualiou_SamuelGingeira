<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BALLHUB</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet" />

    <!-- Tus estilos -->
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/miEstilo.css">
    <link rel="stylesheet" href="../styles/entrenadorDashboard.css">
    

</head>

<body>

    <div id="contenedorAlertas" class="position-fixed top-0 end-0 p-3" style="z-index:9999; width:350px;">

    </div>

    <!-- SIDEBAR / NAVBAR ENTRENADOR -->

<nav class="navbar navbar-expand-md navbar-dark bg-black trainer-navbar">

    <div class="container-fluid flex-md-column">

        <a class="trainer-logo" href="#">
            <span class="trainer-logo-mobile">B</span>
            <span class="trainer-logo-desktop">BALLHUB</span>
        </a>

        <button
            class="navbar-toggler trainer-navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#trainerNavbar"
            aria-controls="trainerNavbar"
            aria-expanded="false"
            aria-label="Abrir navegacion"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse trainer-navbar-collapse" id="trainerNavbar">

            <div class="d-flex flex-column h-100 w-100">

            <div class="text-white-50 trainer-sidebar-text" id="infoEquipo">
                <small>Gestionando equipo</small>
                <div class="fw-bold text-white" id="nombreEquipoSidebar"></div>
            </div>

            <ul class="navbar-nav flex-md-column w-100 trainer-menu">

                <li class="nav-item">
                    <a class="trainer-link active" onclick="showSection('players', this)">
                        <i class="bi bi-people"></i>
                        <span class="trainer-sidebar-text">Jugadores</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="trainer-link" onclick="showSection('trainings', this)">
                        <i class="bi bi-activity"></i>
                        <span class="trainer-sidebar-text">Entrenamientos</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="trainer-link" onclick="showSection('matches', this)">
                        <i class="bi bi-calendar-event"></i>
                        <span class="trainer-sidebar-text">Partidos</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="trainer-link" onclick="showSection('news', this)">
                        <i class="bi bi-newspaper"></i>
                        <span class="trainer-sidebar-text">Noticias</span>
                    </a>
                </li>

            </ul>

            <div class="trainer-logout-wrapper">

                <!-- PERFIL -->
                <div class="d-flex align-items-center gap-3 mb-4 trainer-profile">
                    <span class="trainer-avatar">
                        <img id="fotoEntrenadorSidebar"
                            src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                            width="56" height="56"
                            alt="Foto del entrenador">
                    </span>
                    <div class="trainer-profile-info trainer-sidebar-text">
                        <small class="text-white-50 d-block" id="emailEntrenadorSidebar"></small>
                    </div>
                </div>

                <!-- LOGOUT -->
                <button class="trainer-btn-logout" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="trainer-sidebar-text">Cerrar sesión</span>
                </button>

            </div>

            </div>

        </div>

    </div>

</nav>

    <!-- CONTENIDO -->
    <div class="trainer-main p-4">

        <div class="container py-2">

            <!-- JUGADORES -->
            <section id="players">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h4 class="mb-0">
                            Plantilla
                        </h4>

                        <small class="text-muted">
                            Gestión de jugadores
                        </small>

                    </div>

                    <button class="btn btn-primary" id="btnAniadirJugador" data-bs-toggle="modal"
                        data-bs-target="#modalJugador">

                        <i class="bi bi-plus-circle me-2"></i>
                        Añadir jugador

                    </button>
                </div>


                <div class="row g-4" id="contenedorJugadores">

                </div>

            </section>

            <!-- ENTRENAMIENTOS -->
            <section id="trainings" style="display:none;">

                <div class="container pb-4">
                     <h4 class="mb-0">
                        Asistencia a entrenamientos
                    </h4>

                    <small class="text-muted">
                        Grafico de entrenamientos
                    </small>

                </div>

               

                <div class="contenedor-grafico">
                    <canvas id="graficoAsistencia"></canvas>
                </div>

                

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-0">
                            Entrenamientos
                        </h4>

                        <small class="text-muted">
                            Gestión de entrenamientos
                        </small>
                    </div>
                    <button class="btn btn-primary" id="btnAniadirEntrenamiento" data-bs-toggle="modal" data-bs-target="#modalEntrenamiento">
                        <i class="bi bi-plus-circle me-2"></i>
                        Añadir Entrenamiento
                    </button>
                </div>

                <!-- AQUI VAN LAS TARJETAS -->
                <div id="listaEntrenamientos"></div>

            </section>

            <!-- PARTIDOS -->
            <section id="matches" style="display:none;">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h4 class="mb-0">
                            Partidos
                        </h4>

                        <small class="text-muted">
                            Gestión de partidos
                        </small>

                    </div>

                    <button class="btn btn-primary" id="btnAniadirPartido" data-bs-toggle="modal"
                        data-bs-target="#modalPartido">

                        <i class="bi bi-plus-circle me-2"></i>

                        Añadir partido

                    </button>

                </div>

                <div class="row g-4" id="contenedorPartidos">

                </div>

            </section>

            <!-- NOTICIAS -->
            <section id="news" style="display:none;">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h4 class="mb-0">
                            Noticias
                        </h4>

                        <small class="text-muted">
                            Gestión de noticias
                        </small>

                    </div>

                    <button class="btn btn-primary" id="btnAniadirNoticia">

                        <i class="bi bi-plus-circle me-2"></i>

                        Añadir noticia

                    </button>

                </div>

                <div class="row g-4" id="contenedorNoticias"></div>

            </section>

        </div>

    </div>

    <!-- MODAL ENTRENAMIENTO -->
    <div class="modal fade" id="modalEntrenamiento" tabindex="-1">

        <div class="modal-dialog">

            <div
                class="modal-content"
                id="contenidoModalEntrenamiento">

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalJugador" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content" id="contenidoModalJugador">

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalPartido" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content" id="contenidoModalPartido">

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalNoticia" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content" id="contenidoModalNoticia">

            </div>

        </div>

    </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../scripts/Entrenador/dashboard.js"></script>
    <script src="../scripts/Entrenador/jugadores.js"></script>
    <script src="../scripts/Entrenador/partidos.js"></script>
    <script src="../scripts/Entrenador/noticias.js"></script>
    <script src="../scripts/Entrenador/grafico.js"></script>
    <script src="../scripts/Entrenador/entrenamientos.js"></script>

    <script>

        // Sidebar desktop y collapse movil
const sidebar = document.querySelector('.trainer-navbar')
const mainContent = document.querySelector('.trainer-main')
const trainerNavbar = document.querySelector('#trainerNavbar')

function expandSidebar(){

    if(window.innerWidth >= 768){

        sidebar.classList.add('expanded')
        mainContent.classList.add('expanded')

    }

}

function collapseSidebar(){

    if(window.innerWidth >= 768){

        sidebar.classList.remove('expanded')
        mainContent.classList.remove('expanded')

    }

}

function initTrainerSidebar(){

    if(!sidebar || !mainContent){
        return
    }

    sidebar.removeEventListener('mouseenter', expandSidebar)
    sidebar.removeEventListener('mouseleave', collapseSidebar)

    if(window.innerWidth >= 768){

        sidebar.addEventListener('mouseenter', expandSidebar)
        sidebar.addEventListener('mouseleave', collapseSidebar)

    }else{

        sidebar.classList.remove('expanded')
        mainContent.classList.remove('expanded')

    }

}

initTrainerSidebar()

window.addEventListener('resize', initTrainerSidebar)

document.querySelectorAll('.trainer-link').forEach(link => {

    link.addEventListener('click', () => {

        if(window.innerWidth < 768 && trainerNavbar && trainerNavbar.classList.contains('show')){

            bootstrap.Collapse.getOrCreateInstance(trainerNavbar).hide()

        }

    })

})

</script>
    

</body>

</html>

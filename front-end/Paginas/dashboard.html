<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BALLHUB</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet" />

    <!-- Tus estilos -->
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/miEstilo.css">

    <style>
        /* 🔥 NAVBAR → SIDEBAR EN DESKTOP */
        @media (min-width: 768px) {
            .navbar-dashboard {
                width: 280px;
                height: 100vh;
                position: fixed;
                top: 0;
                left: 0;
                display: flex;
                flex-direction: column;
                padding: 20px;
            }

            .navbar-dashboard .navbar-collapse {
                display: flex !important;
                flex-direction: column;
            }

            .navbar-dashboard .navbar-collapse {
                flex: 1;
            }

            .navbar-dashboard .container-fluid {
                height: 100%;
            }

            .navbar-dashboard .navbar-nav {
                flex-direction: column;
                width: 100%;
            }

            .main-content {
                margin-left: 280px;
                padding: 40px;
                min-height: 100vh;

            }
        }

        /* 📱 MÓVIL NORMAL */
        @media (max-width: 767px) {
            .main-content {
                margin-left: 0;
                width: 100%;
            }
        }

        .navbar-dashboard .nav-link {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .navbar-dashboard .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(6px);
        }

        .navbar-dashboard .nav-link.active {
            background: linear-gradient(135deg, #64a19d, #3c3f3f);
            color: white;
            box-shadow: 0 4px 12px rgba(116, 116, 116, 0.4);
        }

        .tarjetaEntreno {
            background: #dbdada;
            border-radius: 10px;
            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.06),
                0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            padding: 20px;
        }

        .tarjetaEntreno {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 🔥 HOVER PRO */
        .tarjetaEntreno:hover {
            transform: translateY(-4px);
            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.1),
                0 14px 32px rgba(0, 0, 0, 0.18);
        }

        .btnLogout {
            transition: all .2s ease;
            font-size: .95rem;
        }

        .btnLogout:hover {
            color: white !important;
            transform: translateX(4px);
        }

        .tarjeta-partido {

            background: #dbdada;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, .08),
                0 10px 30px rgba(0, 0, 0, .06);

            transition: .25s ease;

        }

        .tarjeta-partido:hover {

            transform: translateY(-4px);

        }

        .encabezado-partido {

            position: relative;

            padding: 42px 20px;

            background-size: cover;

            background-position: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

        }

        .equipo {

            font-size: 2rem;

            font-weight: 800;

            line-height: 1.1;

        }

        .vs {

            font-size: 1.3rem;

            font-weight: 900;

            color: #64a19d;

            margin: 6px 0;

        }

        .badgePartido {

            position: absolute;

            top: 16px;

            right: 16px;

        }

        .info-partido {

            padding: 24px;

        }

        .info-partido p {

            margin-bottom: 12px;

            font-size: 1rem;

        }


        .accionesPartido {

            display: flex;

            gap: 12px;

            padding:
                0 24px 24px;

        }

        .accionesPartido button {

            flex: 1;

            border: none;

            padding: 12px;

            font-weight: 700;

            transition: .2s ease;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, .08);

        }
    </style>

</head>

<body>

    <div id="contenedorAlertas" class="position-fixed top-0 end-0 p-3" style="z-index:9999; width:350px;">

    </div>

    <!-- NAVBAR / SIDEBAR -->
    <nav class="navbar navbar-expand-md navbar-dark bg-black navbar-dashboard">

        <div class="container-fluid flex-md-column align-items-start h-100">

            <a class="navbar-brand mb-md-4" href="#">BALLHUB</a>

            <div class="mb-4 text-white-50" id="infoEquipo">

                <small>
                    Gestionando equipo
                </small>

                <div class="fw-bold text-white" id="nombreEquipoSidebar">

                </div>

            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse h-100" id="menu">

                <ul class="navbar-nav flex-md-column w-100 h-100">

                    <li class="nav-item">
                        <a class="nav-link active" onclick="showSection('players', this)">
                            <i class="bi bi-people me-2"></i> Jugadores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" onclick="showSection('trainings', this)">
                            <i class="bi bi-activity me-2"></i> Entrenamientos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" onclick="showSection('matches', this)">
                            <i class="bi bi-calendar-event me-2"></i> Partidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" onclick="showSection('news', this)">
                            <i class="bi bi-newspaper me-2"></i> Noticias
                        </a>
                    </li>

                    <div class="mt-auto pt-4 pb-4  w-100">

                        <!-- PERFIL -->
                        <div class="d-flex align-items-center gap-3 mb-3 mb-4">

                            <img id="fotoEntrenadorSidebar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                                width="55" height="55" style="
                                border-radius:50%;
                                object-fit:cover;
                            ">

                            <div>

                                <div class="text-white fw-bold" id="nombreEntrenadorSidebar">

                                </div>

                                <small class="text-white-50 d-block" id="emailEntrenadorSidebar">

                                </small>

                            </div>

                        </div>

                        <!-- LOGOUT -->
                        <button class="btn btn-sm border-0 p-0 d-flex align-items-center gap-2 btnLogout"
                            style="color: rgb(133, 0, 0);" onclick="logout()">

                            <i class="bi bi-box-arrow-right"></i>

                            Cerrar sesión

                        </button>

                    </div>





                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <div class="main-content p-4">

        <div class="container py-2">

            <!-- JUGADORES -->
            <section id="players">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h4 class="mb-0">
                            Plantilla
                        </h4>

                        <small class="text-muted">
                            Gestión de jugadores
                        </small>

                    </div>

                    <button class="btn btn-primary" id="btnAniadirJugador" data-bs-toggle="modal"
                        data-bs-target="#modalJugador">

                        <i class="bi bi-plus-circle me-2"></i>
                        Añadir jugador

                    </button>
                </div>


                <div class="row g-4" id="contenedorJugadores">

                </div>

            </section>

            <!-- ENTRENAMIENTOS -->
            <section id="trainings" style="display:none;">

                <h2>Asistencia a entrenamientos</h2>

                <div class="contenedor-grafico">
                    <canvas id="graficoAsistencia"></canvas>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Entrenamientos</h3>
                    <button class="btn btn-primary" id="btnAniadirEntrenamiento" data-bs-toggle="modal" data-bs-target="#modalEntrenamiento">
                        <i class="bi bi-plus-circle me-2"></i>
                        Añadir Entrenamiento
                    </button>
                </div>

                <!-- 🔥 AQUI VAN LAS TARJETAS -->
                <div id="listaEntrenamientos"></div>

            </section>

            <!-- PARTIDOS -->
            <section id="matches" style="display:none;">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h4 class="mb-0">
                            Partidos
                        </h4>

                        <small class="text-muted">
                            Gestión de partidos
                        </small>

                    </div>

                    <button class="btn btn-primary" id="btnAniadirPartido" data-bs-toggle="modal"
                        data-bs-target="#modalPartido">

                        <i class="bi bi-plus-circle me-2"></i>

                        Añadir partido

                    </button>

                </div>

                <div class="row g-4" id="contenedorPartidos">

                </div>

            </section>

            <!-- NOTICIAS -->
            <section id="news" style="display:none;">

                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h4 class="mb-0">
                            Noticias
                        </h4>

                        <small class="text-muted">
                            Gestión de noticias
                        </small>

                    </div>

                    <button class="btn btn-primary" id="btnAniadirNoticia">

                        <i class="bi bi-plus-circle me-2"></i>

                        Añadir noticia

                    </button>

                </div>

                <div class="row g-4" id="contenedorNoticias">

                </div>

            </section>

        </div>

    </div>

    <!-- MODAL ENTRENAMIENTO -->
    <div class="modal fade" id="modalEntrenamiento" tabindex="-1">

        <div class="modal-dialog">

            <div
                class="modal-content"
                id="contenidoModalEntrenamiento">

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalJugador" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content" id="contenidoModalJugador">

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalPartido" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content" id="contenidoModalPartido">

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalNoticia" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content" id="contenidoModalNoticia">

            </div>

        </div>

    </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../scripts/Entrenador/dashboard.js"></script>
    <script src="../scripts/Entrenador/jugadores.js"></script>
    <script src="../scripts/Entrenador/partidos.js"></script>
    <script src="../scripts/Entrenador/noticias.js"></script>
    <script src="../scripts/Entrenador/grafico.js"></script>
    <script src="../scripts/Entrenador/entrenamientos.js"></script>
    

</body>

</html>

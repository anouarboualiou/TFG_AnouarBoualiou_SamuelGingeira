<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BALLHUB</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet" />

    <!-- Tus estilos -->
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/miEstilo.css">

    <style>
        /* 🔥 NAVBAR → SIDEBAR EN DESKTOP */
        @media (min-width: 768px) {
            .navbar-dashboard {
                width: 250px;
                height: 100vh;
                position: fixed;
                top: 0;
                left: 0;
                display: flex;
                flex-direction: column;
                padding: 20px;
            }

            .navbar-dashboard .navbar-collapse {
                display: flex !important;
                flex-direction: column;
            }

            .navbar-dashboard .navbar-nav {
                flex-direction: column;
                width: 100%;
            }

            .main-content {
                margin-left: 250px;
                width: calc(100% - 250px);
            }
        }

        /* 📱 MÓVIL NORMAL */
        @media (max-width: 767px) {
            .main-content {
                margin-left: 0;
                width: 100%;
            }
        }

        .navbar-dashboard .nav-link {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .navbar-dashboard .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(6px);
        }

        .navbar-dashboard .nav-link.active {
            background: linear-gradient(135deg, #64a19d, #3c3f3f);
            color: white;
            box-shadow: 0 4px 12px rgba(116, 116, 116, 0.4);
        }

        .tarjetaEntreno {
            background: #dbdada;
            border-radius: 10px;
            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.06),
                0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            padding: 20px;
        }

        .tarjetaEntreno {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 🔥 HOVER PRO */
        .tarjetaEntreno:hover {
            transform: translateY(-4px);
            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.1),
                0 14px 32px rgba(0, 0, 0, 0.18);
        }
    </style>

</head>

<body>

    <!-- NAVBAR / SIDEBAR -->
    <nav class="navbar navbar-expand-md navbar-dark bg-black navbar-dashboard">

        <div class="container-fluid flex-md-column align-items-start">

            <a class="navbar-brand mb-md-4" href="#">BALLHUB</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav flex-md-column w-100">

                    <li class="nav-item">
                        <a class="nav-link active" onclick="showSection('players', this)">
                            <i class="bi bi-people me-2"></i> Jugadores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" onclick="showSection('trainings', this)">
                            <i class="bi bi-activity me-2"></i> Entrenamientos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" onclick="showSection('matches', this)">
                            <i class="bi bi-calendar-event me-2"></i> Partidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" onclick="showSection('news', this)">
                            <i class="bi bi-newspaper me-2"></i> Noticias
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <div class="main-content p-4">

        <div class="container-fluid">

            <!-- JUGADORES -->
            <section id="players">
                <div class="d-flex justify-content-between mb-4">
                    <h3>Plantilla</h3>
                    <button class="btn btn-primary">+ Añadir</button>
                </div>

                <div class="row g-4">
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="tarjetaNoticia p-4 text-center">
                            <h5>Carlos Martínez</h5>
                            <p>Portero</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ENTRENAMIENTOS -->
            <section id="trainings" style="display:none;">

                <h2>Asistencia a entrenamientos</h2>

                <div class="contenedor-grafico">
                    <canvas id="graficoAsistencia"></canvas>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Entrenamientos</h3>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEntrenamiento">
                        + Añadir
                    </button>
                </div>

                <!-- 🔥 AQUI VAN LAS TARJETAS -->
                <div id="listaEntrenamientos"></div>

            </section>

            <!-- PARTIDOS -->
            <section id="matches" style="display:none;">
                <h3>Partidos</h3>
            </section>

            <!-- NOTICIAS -->
            <section id="news" style="display:none;">
                <h3>Noticias</h3>
            </section>

        </div>

    </div>

    <!-- MODAL ENTRENAMIENTO -->
    <div class="modal fade" id="modalEntrenamiento" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Entrenamiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- BODY -->
                <div class="modal-body">
                    <form id="formEntrenamiento">

                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Hora</label>
                            <input type="time" class="form-control" id="hora" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Duración (horas)</label>
                            <input type="number" class="form-control" id="duracion" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <select class="form-select">
                                <option value="Físico">Físico</option>
                                <option value="Táctico">Táctico</option>
                                <option value="Técnico">Técnico</option>
                            </select>
                        </div>

                        <div class="mb-3" id="grupoFinalizado" style="display:none;">
                            <label class="form-label">¿Finalizado?</label>
                            <select class="form-select" id="finalizado" onchange="toggleAsistentes()">
                                <option value="no">No</option>
                                <option value="si">Sí</option>
                            </select>
                        </div>

                        <div class="mb-3" id="grupoAsistentes" style="display:none;">
                            <label class="form-label">Número de asistentes</label>
                            <input type="number" class="form-control" id="asistentes">
                        </div>

                    </form>
                </div>

                <!-- FOOTER -->
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarEntrenamiento()">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- JS -->
    <script>
        let graficoCreado = false;
        function showSection(sectionId, element) {
            document.querySelectorAll("section").forEach(sec => sec.style.display = "none");

            document.getElementById(sectionId).style.display = "block";

            document.querySelectorAll(".nav-link").forEach(link => link.classList.remove("active"));

            element.classList.add("active");


            if (sectionId === "trainings" && !graficoCreado) {
                setTimeout(() => {
                    crearGrafico();
                }, 100); // pequeño delay para asegurar render

                graficoCreado = true;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../scripts/grafico.js"></script>
    <script src="../scripts/entrenoDashboard.js"></script>

</body>

</html>

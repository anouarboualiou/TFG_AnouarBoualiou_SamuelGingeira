<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Partidos | BALLHUB</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/miEstilo.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet" />

</head>


<body id="page-top">


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">

        <div class="container px-4 px-lg-5">

            <a class="navbar-brand" href="../index.html">BALLHUB</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">

                Menu

            </button>


            <div class="collapse navbar-collapse" id="navbarResponsive">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html#about">INICIO</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html#projects">NOTICIAS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="./partidos.html">PARTIDOS</a>
                    </li>

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">

                            EQUIPOS

                        </a>

                        <ul class="dropdown-menu">

                            <li><a class="dropdown-item" href="#">ALEVIN</a></li>
                            <li><a class="dropdown-item" href="#">INFANTIL</a></li>
                            <li><a class="dropdown-item" href="#">CADETE</a></li>
                            <li><a class="dropdown-item" href="#">JUVENIL</a></li>
                            <li><a class="dropdown-item" href="#">REGIONAL</a></li>

                        </ul>

                    </li>

                    <li class="nav-item">

                        <a href="./inicioSesion.html" class="nav-link">

                            <i class="bi bi-person fs-4"></i>

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- HERO -->

    <header class="masthead">

        <div class="container px-4 px-lg-5 d-flex h-100 align-items-center justify-content-center">

            <div class="text-center">

                <h1 class="mx-auto my-0 text-uppercase">PARTIDOS</h1>

                <h2 class="text-white-50 mx-auto mt-2 mb-5">
                    Consulta todos los encuentros del club
                </h2>

            </div>

        </div>

    </header>



    <!-- FILTROS -->

    <section class="container py-5">

        <div class="row g-3 mb-5 justify-content-center">


            <div class="col-md-3">

                <select id="filtroEquipo" class="form-select">

                    <option value="">Equipo</option>
                    <option value="alevin">Alevín</option>
                    <option value="infantil">Infantil</option>
                    <option value="cadete">Cadete</option>
                    <option value="juvenil">Juvenil</option>
                    <option value="regional">Regional</option>

                </select>

            </div>


            <div class="col-md-3">

                <select id="filtroTemporada" class="form-select">

                    <option value="">Temporada</option>
                    <option value="2025">2024 / 2025</option>
                    <option value="2024">2023 / 2024</option>

                </select>

            </div>


            <div class="col-md-3">

                <select id="filtroEstado" class="form-select">

                    <option value="">Estado</option>
                    <option value="proximo">Próximos</option>
                    <option value="jugado">Jugados</option>

                </select>

            </div>


            <div class="col-md-2">

                <button class="btn btn-primary w-100" onclick="cargarPartidos()">

                    Filtrar

                </button>

            </div>


        </div>



        <!-- LISTA PARTIDOS -->

        <div class="row g-4" id="listaPartidos">


            <!-- EJEMPLO PARTIDO -->

            <div class="col-lg-6">

                <article class="tarjeta-partido">

                    <header class="encabezado-partido text-center text-white bg-dark"
                        style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://pbs.twimg.com/media/Fdkd_NLWAAE-big.png');">

                        <span class="equipo">Juvenil</span>

                        <span class="vs">VS</span>

                        <span class="equipo">CD Segovia</span>

                    </header>

                    <div class="info-partido text-muted text-center">

                        <p class="mt-3">
                            <i class="bi bi-calendar3 text-primary me-2"></i>
                            15 Marzo 2026
                        </p>

                        <p>
                            <i class="bi bi-clock text-primary me-2"></i>
                            18:00
                        </p>

                        <p>
                            <i class="bi bi-geo-alt text-primary me-2"></i>
                            Campo Municipal
                        </p>

                    </div>

                </article>

            </div>


        </div>

    </section>



    <!-- FOOTER -->

    <footer class="footer bg-black small text-center text-white-50">

        <div class="container px-4 px-lg-5">

            Copyright © BALLHUB 2026

        </div>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../scripts/navbarScript.js"></script>


    <script>

        async function cargarPartidos() {

            const equipo = document.getElementById("filtroEquipo").value
            const temporada = document.getElementById("filtroTemporada").value
            const estado = document.getElementById("filtroEstado").value

            let url = "/api/partidos?"

            if (equipo) url += "equipo=" + equipo + "&"
            if (temporada) url += "temporada=" + temporada + "&"
            if (estado) url += "estado=" + estado

            const res = await fetch(url)

            const partidos = await res.json()

            const contenedor = document.getElementById("listaPartidos")

            contenedor.innerHTML = ""

            partidos.forEach(p => {

                contenedor.innerHTML += `

<div class="col-lg-6">

<article class="tarjeta-partido">

<header class="encabezado-partido text-center text-white bg-dark">

<span class="equipo">${p.equipo}</span>

<span class="vs">VS</span>

<span class="equipo">${p.rival}</span>

</header>

<div class="info-partido text-muted text-center">

<p class="mt-3">
<i class="bi bi-calendar3 text-primary me-2"></i>
${p.fecha}
</p>

<p>
<i class="bi bi-clock text-primary me-2"></i>
${p.hora}
</p>

<p>
<i class="bi bi-geo-alt text-primary me-2"></i>
${p.campo}
</p>

</div>

</article>

</div>

`

            })

        }

    </script>


</body>

</html>
